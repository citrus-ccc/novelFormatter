<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Novel Formatter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wrap">
  <h1>Novel Formatter</h1>
  <p class="lead">
    小説原稿をブラウザ上で整形・変換します。整形は以下のルールに従います。オプションでルールのON/OFFを切り替え可能です。
  </p>
  <ul>
    <li>会話の前後に空行を入れる</li>
    <li>段落間の空行を詰める</li>
    <li>段落先頭に全角スペースを入れる</li>
  </ul>
  <div class="toolbar">
    <button class="primary" id="formatBtn">整形する</button>
    <button id="convertNarouBtn">なろう変換</button>
    <button id="convertKakuyomuBtn">カクヨム変換</button>
    <button id="convertEverystarBtn">エブリスタ変換</button>
    <button id="copyBtn">結果をコピー</button>
    <button id="themeToggleBtn">☀️ ライトテーマ</button>
  </div>

  <div class="options">
    <label>
      <input type="checkbox" id="optIndent" checked>
      段落先頭に全角スペースを入れる
    </label>
    <label>
      <input type="checkbox" id="optBlockBlank" checked>
      会話ブロック前後に空行を入れる
    </label>
    <label>
      <input type="checkbox" id="optTrimDialogueBlank" checked>
      会話ブロック内／ブロック同士の間の空行を詰める
    </label>
    <label>
      <input type="checkbox" id="optRemoveHeadings">
      見出し記号（# / ## など）だけ消す
    </label>
  </div>

  <section class="grid">
    <div class="panel">
      <div class="panel-header">
        <h2>入力</h2>
        <span class="status" id="inputStatus">未整形</span>
      </div>
      <textarea id="inputText" placeholder="ここに小説原稿を貼り付けてください"></textarea>
    </div>

    <div class="panel">
      <div class="panel-header">
        <h2>出力</h2>
        <span class="status" id="outputStatus">待機中</span>
      </div>
      <textarea id="outputText" placeholder="整形結果がここに表示されます"></textarea>
    </div>
  </section>

  <div class="help">
    <div>・開き括弧: 「『（(【〈《〔［｛</div>
    <div>・閉じ括弧: 」』）)】〉》〕］｝</div>
    <div>・会話ブロック内／会話ブロックどうしの間の空行は、オプションON時に詰めます。</div>
    <div>・連続空行は常に 1 行に圧縮します。</div>
    <div>・見出し記号除去ON時は「# タイトル」→「タイトル」のように # 部分だけ消します。</div>
  </div>
</main>

<script src="script.js"></script>
</body>
</html>
